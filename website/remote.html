<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self'; script-src 'self'"><title>Connexion web — Madrador Remote</title><link rel="stylesheet" href="/remote.css"></head>
<body><header class="remote-nav"><a href="/" class="brand"><img src="/logo.png" alt=""><span>Madrador Remote</span></a><b id="status">Prêt</b><button id="leave" disabled>Quitter</button></header>
<main class="remote-shell">
  <section id="connectPanel" class="connect-card"><span>VIEWER WEB</span><h1>Se connecter à un PC</h1><p>L’application Madrador Remote doit être ouverte sur le PC distant.</p><label for="code">Code à neuf chiffres</label><input id="code" maxlength="11" inputmode="numeric" placeholder="000 000 000"><button id="connect">Demander la connexion</button><small>Aucun code ni contenu de session n’est enregistré dans ce navigateur.</small></section>
  <section id="sessionPanel" hidden><div class="tools"><button id="fit">Ajuster</button><button id="zoomOut">−</button><b id="zoomLabel">100 %</b><button id="zoomIn">+</button><button id="fullscreen">Plein écran</button><span id="permissions">Lecture seule</span></div><div id="stage"><video id="video" autoplay playsinline tabindex="0"></video></div><div class="stats"><span>Latence <b id="latency">—</b></span><span>Codec <b id="codec">—</b></span><span>Connexion <b id="network">—</b></span><span>Résolution <b id="resolution">—</b></span></div><div class="exchange"><div><h2>Discussion</h2><div id="messages"></div><input id="message" placeholder="Message"><button id="sendMessage">Envoyer</button></div><div><h2>Presse-papiers</h2><textarea id="clipboard"></textarea><button id="sendClipboard">Partager le texte</button></div><div><h2>Fichier</h2><input id="file" type="file"><button id="sendFile">Envoyer par WebRTC</button><p id="fileStatus"></p></div></div></section>
  <noscript>JavaScript est nécessaire pour utiliser la connexion distante.</noscript>
</main><script src="/socket.io/socket.io.js"></script><script type="module" src="/remote.js"></script></body></html>

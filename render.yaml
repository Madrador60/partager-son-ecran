# Blueprint Render : héberge gratuitement le serveur de signalisation public.
# Render › New › Blueprint › choisir ce dépôt. Voir DEPLOYMENT.md.
services:
  - type: web
    name: madrador-signal
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_ORIGIN
        value: https://madrador60.github.io
      - key: MAX_FILE_MB
        value: "25"
      - key: RECONNECT_GRACE_MS
        value: "120000"
      # Facultatif mais fortement conseillé : serveur TURN (relais vidéo pour les NAT stricts, 4G…).
      # static = identifiants fixes d'un service hébergé (ex. Metered) ; hmac = Coturn auto-hébergé.
      - key: MADRADOR_TURN_MODE
        value: static
      - key: MADRADOR_TURN_URL
        sync: false
      - key: MADRADOR_TURN_USERNAME
        sync: false
      - key: MADRADOR_TURN_CREDENTIAL
        sync: false
